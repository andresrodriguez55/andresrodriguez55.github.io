version: '3'

services:
  mysql:
    image: mysql:latest
    container_name: mysql-blog
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: dev
      MYSQL_USER: dev
      MYSQL_PASSWORD: dev
    ports:
      - "3306:3306"
    networks:
      - global
    volumes:
      - ./sql:/docker-entrypoint-initdb.d

networks:
  global:
    driver: bridge