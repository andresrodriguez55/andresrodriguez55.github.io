<html>
<head>
    <style>
        .postGrid {
            background-color: rgba(230, 230, 230, 0.308);
            position: relative;
            -webkit-transition: all 400ms;
        }

        .postGridImage {
            display: block;
            margin-left: auto;
            margin-right: auto;
            width: 50%;
            filter: brightness(70%);
        }

        .postGridInformation {
            background-color: #000000;
            color: white;
            text-shadow: 2px 2px 2px #000000;
            position: absolute;
            bottom: 15%;
            padding-left: 2%;
            padding-right: 2%;
            padding-top: 10px;
            padding-bottom: 10px;
            width: 48%;
        }

        .postGridTitle {
            font-size: 135%;
            margin: 0;
        }

        .postGridDate {
            font-size: 82%;
        }

        .postGridCategory {
            font-size: 90%;
        }
    </style>
</head>
<body>
<div class='postGrid'>
    <img class='postGridImage' src='{{ imageUrl }}'/>
    <center>
        <div class='postGridInformation'>
            <h2 class='postGridTitle'>{{ title }}</h2>
            <p class='postGridCategory'>Category: {{ category }}</p>
            <p class='postGridDate'>{{ date }}</p>
        </div>
    </center>
</div>
<a href='{{ postUrl }}'> Post link.</a>
<br><br>
<a href='{{ unsubscribeUrl }}'> Unsubscribe </a>
</body>
</html>
