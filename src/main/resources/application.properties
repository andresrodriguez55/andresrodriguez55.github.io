server.port=10000

spring.main.allow-circular-references=false

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.datasource.hikari.connection-timeout=50000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.pool-name=ConnPool
spring.datasource.hikari.connection-test-query=select 1 from dual

#mysql caching
spring.datasource.hikari.data-source-properties.cachePrepStmts=true
#prepStmtCacheSize This sets the number of prepared statements that the MySQL driver will cache per connection
spring.datasource.hikari.data-source-properties.prepStmtCacheSize=100
#maximum length of a prepared SQL statement that the driver will cache
spring.datasource.hikari.data-source-properties.prepStmtCacheSqlLimit=2048
#Newer versions of MySQL support server-side prepared statements
spring.datasource.hikari.data-source-properties.useServerPrepStmts=true
spring.datasource.hikari.data-source-properties.useLocalSessionState=true
spring.datasource.hikari.data-source-properties.rewriteBatchedStatements=true
spring.datasource.hikari.data-source-properties.cacheResultSetMetadata=true
spring.datasource.hikari.data-source-properties.cacheServerConfiguration=true
spring.datasource.hikari.data-source-properties.elideSetAutoCommits=true
spring.datasource.hikari.data-source-properties.maintainTimeStats=false
logging.level.com.zaxxer.hikari.HikariConfig=DEBUG
logging.level.com.zaxxer.hikari=WARN
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.show_sql=true
logging.level.org.hibernate.orm.jdbc.bind=trace

#mailservice.hostmail = ${SENDGRID_EMAIL}
#mailservice.sendgrid.apikey=${SENDGRID_API_KEY}

jwt.key=${JWT_KEY}

# Tomcat thread pool settings
server.tomcat.max-threads=300  # Maximum number of threads
server.tomcat.min-spare-threads=20  # Minimum number of idle threads
server.tomcat.accept-count=150
server.tomcat.max-connections=2000

inmemoryratelimiter.maxrequests=20
inmemoryratelimiter.windowsizeinseconds=1
inmemoryratelimiter.cleanupinterval=3

#spring.jpa.properties.hibernate.cache.use_second_level_cache=true
# docker run --name redisContainer -d -p 6379:6379 redis
mailservice.strategy=smtp
mailservice.host=${MAIL_HOST}
mailservice.hostmail=${MAIL_USERNAME}
mailservice.password=${MAIL_PASSWORD}
mailservice.port=${MAIL_PORT:587}

# OSIV
spring.jpa.open-in-view=false